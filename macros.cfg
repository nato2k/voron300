[gcode_macro homevalue]
gcode:
   M118 "homed axes" {printer.toolhead.homed_axes}

[gcode_macro MOVE_FRONT]
description: Home if needed, run QGL, Z-hop, then move to X150 Y10 Z200
gcode:
    {% set z_hop = 10 %}

    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
        QUAD_GANTRY_LEVEL
        G28 Z
    {% else %}
        G91                         ; relative positioning
        G0 Z{z_hop} F3000           ; Z-hop
        G90                         ; back to absolute
    {% endif %}

    G90
    G0 X150 Y10 F6000              ; move XY first (safer on Voron)
    G0 Z200 F3000                  ; then move Z