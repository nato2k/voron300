#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
[gcode_macro PRINT_START]
gcode:
  M117 Preparing print
  SET_GCODE_OFFSET Z=0
  BED_MESH_CLEAR
  SET_PIN PIN=caselight VALUE=0.5
  STATUS_READY
  {% set Squish = 0.0185 | float %}
  {% set BedTemperature = params.BED_TEMPERATURE | default(60) | int %}
  {% set ExtruderTemperature = params.EXTRUDER_TEMPERATURE | default(210) | int %}
  {% set ExtruderStandbyTemperature = params.EXTRUDER_STANDBY_TEMPERATURE | default(150) | int %}
  {% set target_chamber = params.CHAMBER|default(25)|int %}
  

  
  M117 Initializing
  G90 ; use absolute coordinates
  M82 ; extruder absolute mode
  M106 S128 ; Part cooling fan on to protect cooling ducts and probes
  
  STATUS_HOMING
  G28 X Y
  G28 Z METHOD=CONTACT CALIBRATE=1
  
  STATUS_HEATING
  M140 S{BedTemperature} ; set bed temp
  M104 S{ExtruderStandbyTemperature} ; set standby extruder temp
  G0 X250 Y250 Z25 F3000;move middle
  #M106 S255 ;use fan to circulate hot air
  M190 S{BedTemperature} ; wait for bed temp
  STATUS_HEATING

  {% if BedTemperature > 90 %}
    M190 S115
    G0 X280 Y50 Z2 F3000
    M106 S255 ;use fan to circulate hot air
    M191 S{target_chamber} ;heatsoak
    M117 '2m Heatsoak'
    G4 P120000
    M190 S{BedTemperature}
    
  {% endif %}
  
  STATUS_LEVELING
  QUAD_GANTRY_LEVEL
  M117
  #STATUS_CLEANING
  #CLEANNOPURGE
  #G0 Y250 Z25 F3000
  STATUS_HOMING

 
 
  BED_MESH_CALIBRATE
  
  M104 S{ExtruderTemperature} ; set first layer extruder temp
  M117 Wait Nozzle
  M109 S{ExtruderTemperature} ; wait for extruder temp
  #M83
  #G1 E-1 F180
  #G92 E0
  M117 '2m Nozzle Soak'
  G4 P120000
  CLEANNOPURGE
  G28 Z METHOD=CONTACT CALIBRATE=0
  #CLEAN_NOZZLE_NO_RET
  {% if params.MATERIAL == "FLEX" %}
    SQUIGGLY_PURGE FLOWRATE=2.5 PURGE_LENGTH=50
  {% else %}
    SQUIGGLY_PURGE
  {% endif %}
  #SET_GCODE_OFFSET Z=0.0090
  {% if ExtruderTemperature > 260 %}
    SET_GCODE_OFFSET Z_ADJUST=-0.0800
  {% else %}
    SET_GCODE_OFFSET Z_ADJUST=-0.0400
  {% endif %}
  #M83
  #G1 E1 F1800
  #G92 E0
  #G0 Z25 F3000
  #G0 Y250 F3000
  STATUS_PRINTING
  SET_VELOCITY_LIMIT ACCEL=5700 VELOCITY=450
  

#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 20, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    M83
    G92 E0                         ; zero the extruder
    
    #SET_PIN PIN=caselight VALUE=0
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    ;G0 X100 Y305 F20000
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    G1 E-25.0 F300                 ; retract filament
    ;CLEANNOPURGE
    BED_MESH_CLEAR
    ;SET_LED LED="sb_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    G92 E0
    G90